<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Research Agent — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <h1>Research Agent Settings</h1>
    <div class="field">
      <label for="api-url">Backend API URL</label>
      <input type="url" id="api-url" placeholder="http://localhost:8000" />
      <p class="hint">Default: http://localhost:8000</p>
    </div>
    <button id="save">Save</button>
    <p id="status" class="status"></p>
  </div>
  <script src="options.js"></script>
</body>
</html>
